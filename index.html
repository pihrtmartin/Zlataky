<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Správa úkolů a odměn</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        h1, h2 {
            text-align: center;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select, input[type="text"], input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .hidden {
            display: none;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background: #e9ecef;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .actions {
            display: flex;
            gap: 5px;
        }
        .btn-sm {
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
            width: auto;
            margin: 0;
        }
        .edit-btn { background-color: #ffc107; color: #333; }
        .edit-btn:hover { background-color: #e0a800; }
        .delete-btn { background-color: #dc3545; }
        .delete-btn:hover { background-color: #c82333; }
    </style>
</head>
<body>

<div class="container">
    <h1>Správa úkolů domácnosti</h1>
    <button id="showFormBtn">Přidat úkol</button>

    <div id="taskFormContainer" class="hidden">
        <div class="form-group">
            <label for="memberSelect">1. Člen domácnosti</label>
            <select id="memberSelect">
                <option value="Tatínek">Tatínek</option>
                <option value="Maminka">Maminka</option>
                <option value="Syn 1">Syn 1</option>
                <option value="Syn 2">Syn 2</option>
            </select>
        </div>

        <div class="form-group">
            <label for="categorySelect">2. Kategorie</label>
            <select id="categorySelect">
                <option value="Domácnost">Domácnost</option>
                <option value="Škola">Škola</option>
                <option value="Jiné">Jiné</option>
            </select>
        </div>

        <div class="form-group">
            <label for="taskSelect">3. Úkol</label>
            <select id="taskSelect">
                <optgroup label="Povinné úkoly">
                    <option value="Uklidit si pokoj">Uklidit si pokoj (Povinný)</option>
                    <option value="Učit se do školy">Učit se do školy (Povinný)</option>
                    <option value="Vynést koš">Vynést koš (Povinný)</option>
                </optgroup>
                <optgroup label="Nepovinné úkoly">
                    <option value="Pomoci s nákupem">Pomoci s nákupem (Nepovinný)</option>
                    <option value="Umýt nádobí">Umýt nádobí (Nepovinný)</option>
                </optgroup>
                <option value="custom">-- Napsat úkol ručně --</option>
            </select>
        </div>

        <div class="form-group hidden" id="customTaskGroup">
            <label for="customTaskInput">Vlastní úkol</label>
            <input type="text" id="customTaskInput" placeholder="Napište úkol ručně...">
        </div>

        <button id="saveTaskBtn">Uložit úkol</button>
    </div>

    <h2>Seznam úkolů</h2>
    <ul id="taskList"></ul>
</div>

<div class="container">
    <h1>Správa odměn (Administrátor)</h1>
    <div id="rewardEditContainer" class="hidden" style="margin-bottom: 20px; padding: 15px; background: #f8f9fa; border-radius: 4px;">
        <h3>Upravit odměnu</h3>
        <input type="hidden" id="editRewardId">
        <div class="form-group">
            <label for="editRewardName">Název odměny</label>
            <input type="text" id="editRewardName">
        </div>
        <div class="form-group">
            <label for="editRewardCoins">Počet zlaťáků</label>
            <input type="number" id="editRewardCoins">
        </div>
        <button id="saveRewardBtn">Uložit změny odměny</button>
    </div>

    <h2>Seznam odměn</h2>
    <ul id="rewardList"></ul>
</div>

<script>
    // Úkoly logika
    const showFormBtn = document.getElementById('showFormBtn');
    const taskFormContainer = document.getElementById('taskFormContainer');
    const taskSelect = document.getElementById('taskSelect');
    const customTaskGroup = document.getElementById('customTaskGroup');
    const saveTaskBtn = document.getElementById('saveTaskBtn');
    const taskList = document.getElementById('taskList');

    showFormBtn.addEventListener('click', () => {
        taskFormContainer.classList.toggle('hidden');
    });

    taskSelect.addEventListener('change', (e) => {
        if (e.target.value === 'custom') {
            customTaskGroup.classList.remove('hidden');
        } else {
            customTaskGroup.classList.add('hidden');
        }
    });

    saveTaskBtn.addEventListener('click', () => {
        const member = document.getElementById('memberSelect').value;
        const category = document.getElementById('categorySelect').value;
        let taskName = taskSelect.value;

        if (taskName === 'custom') {
            taskName = document.getElementById('customTaskInput').value.trim();
            if (!taskName) {
                alert('Prosím zadejte text vlastního úkolu.');
                return;
            }
        }

        const li = document.createElement('li');
        li.innerHTML = `
            <span><strong>${member}</strong> [${category}] - ${taskName}</span>
            <div class="actions">
                <button class="btn-sm delete-btn" onclick="this.closest('li').remove()">Smazat</button>
            </div>
        `;

        taskList.appendChild(li);

        document.getElementById('customTaskInput').value = '';
        taskSelect.value = 'Uklidit si pokoj';
        customTaskGroup.classList.add('hidden');
        taskFormContainer.classList.add('hidden');
    });

    // Odměny logika (Správce)
    let rewards = [
        { id: 1, name: 'Extra hodina u tabletů', coins: 50 },
        { id: 2, name: 'Výběr filmu na večer', coins: 40 },
        { id: 3, name: 'Sladká odměna', coins: 30 }
    ];

    const rewardList = document.getElementById('rewardList');
    const rewardEditContainer = document.getElementById('rewardEditContainer');
    const editRewardId = document.getElementById('editRewardId');
    const editRewardName = document.getElementById('editRewardName');
    const editRewardCoins = document.getElementById('editRewardCoins');
    const saveRewardBtn = document.getElementById('saveRewardBtn');

    function renderRewards() {
        rewardList.innerHTML = '';
        rewards.forEach(reward => {
            const li = document.createElement('li');
            li.innerHTML = `
                <span><strong>${reward.name}</strong> - ${reward.coins} zlaťáků</span>
                <div class="actions">
                    <button class="btn-sm edit-btn" onclick="editReward(${reward.id})">Upravit</button>
                </div>
            `;
            rewardList.appendChild(li);
        });
    }

    window.editReward = function(id) {
        const reward = rewards.find(r => r.id === id);
        if (reward) {
            editRewardId.value = reward.id;
            editRewardName.value = reward.name;
            editRewardCoins.value = reward.coins;
            rewardEditContainer.classList.remove('hidden');
        }
    }

    saveRewardBtn.addEventListener('click', () => {
        const id = parseInt(editRewardId.value);
        const name = editRewardName.value.trim();
        const coins = parseInt(editRewardCoins.value);

        if (!name || isNaN(coins)) {
            alert('Vyplňte prosím správně název i počet zlaťáků.');
            return;
        }

        const reward = rewards.find(r => r.id === id);
        if (reward) {
            reward.name = name;
            reward.coins = coins;
        }

        rewardEditContainer.classList.add('hidden');
        renderRewards();
    });

    // Inicializace výpisu odměn
    renderRewards();
</script>

</body>
</html>
